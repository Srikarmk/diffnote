[project]
name = "diffnote"
version = "0.1.0"
description = "A 1.5B model LoRA-tuned on my own commit history, measured on repos it never saw"
readme = "README.md"
authors = [
    { name = "Srikarmk", email = "srikarmks@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx-lm>=0.32.2",
]

[project.scripts]
diffnote = "diffnote.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
